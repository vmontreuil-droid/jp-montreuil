<svg xmlns="http://www.w3.org/2000/svg" width="120" height="400" viewBox="0 0 120 400">
  <!-- Houtnerf voor fine_art kader-rand -->
  <defs>
    <filter id="wood">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.4" numOctaves="3" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0 0.05  0 0 0 0.85 0"/>
    </filter>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1612"/>
      <stop offset="50%" stop-color="#241e18"/>
      <stop offset="100%" stop-color="#1a1612"/>
    </linearGradient>
  </defs>
  <rect width="120" height="400" fill="url(#woodBase)"/>
  <rect width="120" height="400" filter="url(#wood)"/>
</svg>
